name: Bug Report
description: Report a bug, malfunction, or unexpected behavior in Project AEGIS.
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report! Please provide as much detail as possible.
        If you are reporting a security vulnerability, please refer to our [Security Policy](SECURITY.md).
  - type: input
    id: environment
    attributes:
      label: Deployment Environment
      description: What AWS / OS environment are you running AEGIS on?
      placeholder: "e.g., AWS Multi-Account (Security + Workloads), LocalStack, Ubuntu 24.04, Python 3.12"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually occurred? Include error logs or stack traces.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can maintainers reproduce this issue?
      placeholder: |
        1. Deploy module `terraform/modules/...`
        2. Ingest event payload ...
        3. Observe error ...
    validations:
      required: true
