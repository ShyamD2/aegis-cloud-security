name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  python-quality:
    name: Python Linting & Type Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff Format Check
        run: ruff format --check .

      - name: Run Ruff Lint
        run: ruff check .

      - name: Run Mypy Type Check
        run: mypy services/ tests/

  python-tests:
    name: Unit & Security Tests
    runs-on: ubuntu-latest
    needs: python-quality
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Pytest with Coverage
        run: |
          pytest --cov=services --cov-report=term-missing tests/

  terraform-checks:
    name: Terraform Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive terraform/

      - name: Terraform Validate (Bootstrap)
        run: |
          cd terraform/bootstrap
          terraform init -backend=false
          terraform validate

      - name: Terraform Validate (Dev Environment)
        run: |
          cd terraform/environments/dev
          terraform init -backend=false
          terraform validate
